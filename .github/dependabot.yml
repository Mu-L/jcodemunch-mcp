version: 2
# Security-only, batched. We do NOT run version updates (open-pull-requests-limit: 0
# suppresses them); Dependabot still opens PRs for actual vulnerability alerts, and the
# `groups` directive collapses those into a single combined PR instead of one-per-alert.
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  # GitHub Actions are SHA-pinned in .github/workflows/*.yml; this keeps them
  # covered by vulnerability alerts (same security-only posture as `uv` above —
  # version-update noise suppressed, security PRs grouped).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # docs/cicd/DESIGN.md section 4: MONTHLY version updates in two groups, one
  # PR each, minor and patch only. Majors stay manual. Every PR runs the full
  # PR gate, which is the point of letting them in.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      python-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
