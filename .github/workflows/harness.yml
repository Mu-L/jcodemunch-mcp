# The engineering harness (docs/harness/DESIGN.md): the single command that
# says whether a change is acceptable against docs/standard/STANDARD.md.
#
#   PR / push       -> python -m harness fast   (offline pins + Floor checks, ~1 min)
#   push to main    -> python -m harness bench --offline --write-results
#                      (replay, route recall, schema capture, self-latency ...),
#                      result JSON uploaded as an artifact (90 days)
#   Mondays 06:30Z  -> same bench run, then harness/results/latest.json is
#                      COMMITTED so `git log -p` on that file is the trend.
#
# The full test tier is test.yml (unchanged); its coverage floor and skip
# ceiling are read from harness/thresholds.json there.
name: Harness

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: Harness fast tier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: "0.9.5"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev --extra watch
      - name: Fast tier
        run: uv run python -m harness fast --write-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: harness-fast-${{ github.sha }}
          path: harness/results/latest.json
          retention-days: 90

  bench:
    name: Harness bench tier (offline)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: "0.9.5"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev --extra watch
      - name: Bench tier
        run: uv run python -m harness bench --offline --write-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: harness-bench-${{ github.sha }}
          path: |
            harness/results/latest.json
            harness/results/self_latency.json
          retention-days: 90
      - name: Commit the weekly result (schedule only)
        if: github.event_name == 'schedule'
        run: |
          git config user.name "harness-bot"
          git config user.email "harness-bot@users.noreply.github.com"
          git add harness/results/latest.json harness/results/self_latency.json
          git diff --cached --quiet && exit 0
          git commit -m "harness: weekly bench result ($(date -u +%Y-%m-%d))"
          git push
