# Post-publish handshake (ENFORCEMENT-PLAN item 5, #536).
#
# Every test and every CI leg runs from source, where `__version__` is
# "unknown", so nothing in the suite can see what the PUBLISHED artifact puts
# on the wire. This job installs `jcodemunch-mcp==<tag>` from PyPI into a
# fresh venv on ubuntu and windows, performs a real stdio `initialize`, and
# fails unless serverInfo.version equals the tag and `instructions` is
# non-empty. It ran by hand once (1.108.293) and never since.
#
# Trigger: a published GitHub release (tag vX.Y.Z), or workflow_dispatch with
# the version. PyPI propagation is polled for up to 10 minutes. ⚠ Never via
# bare `uvx`: it served a cached build once and reproduced the pre-fix
# symptoms exactly.
name: Handshake

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to probe (X.Y.Z, no v)"
        required: true

permissions:
  contents: read

jobs:
  handshake:
    name: handshake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: "0.9.5"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Resolve version
        id: v
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "probing jcodemunch-mcp==$V"
      - name: Wait for PyPI (up to 10 min)
        shell: bash
        run: |
          V="${{ steps.v.outputs.version }}"
          for i in $(seq 1 40); do
            if curl -fsS "https://pypi.org/pypi/jcodemunch-mcp/$V/json" >/dev/null; then echo "on PyPI after $((i*15-15))s"; exit 0; fi
            sleep 15
          done
          echo "jcodemunch-mcp==$V not on PyPI after 10 minutes"; exit 1
      - name: Fresh venv with ONLY the published artifact
        shell: bash
        run: |
          uv venv "${RUNNER_TEMP}/hs" --python 3.12
          uv pip install --python "${RUNNER_TEMP}/hs" "jcodemunch-mcp==${{ steps.v.outputs.version }}"
      - name: Real stdio initialize
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then B="${RUNNER_TEMP}/hs/Scripts"; else B="${RUNNER_TEMP}/hs/bin"; fi
          PATH="$B:$PATH" "$B/python" scripts/handshake.py --expect-version "${{ steps.v.outputs.version }}"
