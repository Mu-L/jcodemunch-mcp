# ⚠ MAINTENANCE: editing this file creates a release obligation.
#
# External consumers pin `@health-radar-vX.Y.Z` or track `@health-radar-v1`.
# A change here reaches NEITHER until it is tagged, which is how the
# --depth=1 base fetch stayed live for consumers after it was fixed on main.
#
# On any change to this file:
#   1. git tag -a health-radar-vX.Y.Z -m "..."      (immutable, new version)
#   2. git tag -f health-radar-v1                    (floating, moves forward)
#   3. git push origin health-radar-vX.Y.Z && git push -f origin health-radar-v1
#
# ⚠ NEVER repoint an existing health-radar-vX.Y.Z. The floating v1 is the only
# tag here that moves, and consumers opt into that by choosing it. `v1.88.0`
# is left pointing at the known-bad version deliberately; see README.md.
#
# This is a documented habit, not an enforced ratchet. Tags are not reliably
# present in a CI checkout, so a guard test here would either be skippable
# (and therefore invisible) or flaky. Treated as weaker than the ratchets in
# tests/, and named as such rather than pretended otherwise.

name: 'jCodeMunch Health Radar'
description: >-
  Compute a six-axis code-health radar on the PR branch and the base branch,
  diff them, and post the result as a sticky PR comment. Suggestion-style;
  never blocks merges.
author: 'jgravelle'
branding:
  icon: 'activity'
  color: 'purple'

inputs:
  python-version:
    description: 'Python version for the Actions runner.'
    default: '3.11'
    required: false
  jcodemunch-version:
    description: >-
      Pin a specific jcodemunch-mcp version (e.g. 1.88.0) or 'latest'.
    default: 'latest'
    required: false
  base-ref:
    description: >-
      Git ref to compare against (default: the PR's base branch).
    default: ''
    required: false
  github-token:
    description: 'Token for posting/editing the PR comment.'
    default: ${{ github.token }}
    required: false

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install jcodemunch-mcp
      shell: bash
      run: |
        if [ "${{ inputs.jcodemunch-version }}" = "latest" ]; then
          pip install -U jcodemunch-mcp
        else
          pip install "jcodemunch-mcp==${{ inputs.jcodemunch-version }}"
        fi
        jcodemunch-mcp --version || true

    - name: Resolve base ref
      id: base
      shell: bash
      run: |
        BASE="${{ inputs.base-ref }}"
        if [ -z "$BASE" ]; then
          BASE="${{ github.base_ref }}"
        fi
        if [ -z "$BASE" ]; then
          echo "no base ref available — skipping (this Action is meant for pull_request triggers)"
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
        fi

    - name: Ensure full history on the PR side
      # Symmetry with the base fetch below. A caller using actions/checkout's
      # default `fetch-depth: 1` would otherwise hand us a shallow head and a
      # deep base, which is the same churn asymmetry in the other direction.
      # Our own caller already sets `fetch-depth: 0`, so this is a no-op here.
      if: steps.base.outputs.skip != 'true'
      shell: bash
      run: |
        if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
          git fetch --unshallow
        fi

    - name: Compute radar on PR branch
      if: steps.base.outputs.skip != 'true'
      shell: bash
      run: |
        jcodemunch-mcp index .
        jcodemunch-mcp health . --radar-only > "$RUNNER_TEMP/pr_radar.json"
        echo "PR radar:"
        cat "$RUNNER_TEMP/pr_radar.json"

    - name: Compute radar on base branch
      if: steps.base.outputs.skip != 'true'
      shell: bash
      env:
        BASE: ${{ steps.base.outputs.base }}
      run: |
        # Stash uncommitted state isn't needed (clean checkout in CI), but
        # capture HEAD so we can restore it.
        ORIG_REF=$(git rev-parse HEAD)
        echo "$ORIG_REF" > "$RUNNER_TEMP/orig_ref"

        # Both sides must see the SAME history depth. `git fetch --depth=1`
        # does not merely limit what it downloads: run against an already
        # complete clone it SHORTENS it, writing .git/shallow and dropping the
        # repo to one reachable commit. `churn_surface` is
        # complexity x log(1 + churn) with churn counted by
        # `git log --since=<N> days ago`, so a one-commit base scores every
        # file at churn <= 1 and the base comes back artificially healthy.
        # Measured on this repo: 1390 commits / 482 in the last 90 days before
        # the depth=1 fetch, 1 and 1 after. The same commit then grades B as a
        # base and C as a head, and every PR is charged for the gap.
        if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
          git fetch origin "$BASE" --unshallow
        else
          git fetch origin "$BASE"
        fi
        git checkout "origin/$BASE" --quiet || git checkout "$BASE" --quiet

        # Re-index against the base tree.
        jcodemunch-mcp index .
        jcodemunch-mcp health . --radar-only > "$RUNNER_TEMP/base_radar.json"
        echo "Base radar:"
        cat "$RUNNER_TEMP/base_radar.json"

        # Restore PR HEAD so any subsequent steps see the PR tree.
        git checkout "$ORIG_REF" --quiet

    - name: Render comment markdown
      if: steps.base.outputs.skip != 'true'
      id: render
      shell: bash
      run: |
        VERSION=$(python -c "from importlib.metadata import version; print(version('jcodemunch-mcp'))" 2>/dev/null || echo "")
        python "${GITHUB_ACTION_PATH}/render_comment.py" \
          --baseline "$RUNNER_TEMP/base_radar.json" \
          --current  "$RUNNER_TEMP/pr_radar.json" \
          --version  "$VERSION" \
          > "$RUNNER_TEMP/comment.md"
        echo "Rendered comment:"
        cat "$RUNNER_TEMP/comment.md"

    - name: Post or update sticky comment
      # Fork-sourced pull_request events get a read-only GITHUB_TOKEN,
      # so the comment POST returns 403 regardless of the workflow's
      # declared `permissions:` block. For fork PRs we instead upload
      # the rendered comment as an artifact in the calling workflow and
      # post it from a workflow_run-triggered companion job (which DOES
      # run in the base repo's trusted secret context). See
      # .github/workflows/health-radar-comment.yml.
      if: >-
        steps.base.outputs.skip != 'true'
        && github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.fork != true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        # Sticky-comment pattern: find existing comment by HTML marker; PATCH it
        # if found, otherwise POST a new one. Marker is on the first line of the
        # rendered body so a simple startswith match is robust.
        EXISTING=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
          --jq '.[] | select(.body | startswith("<!-- jcm-health-radar -->")) | .id' \
          | head -n1)

        if [ -n "$EXISTING" ]; then
          gh api "repos/${REPO}/issues/comments/${EXISTING}" \
            --method PATCH \
            -F "body=@${RUNNER_TEMP}/comment.md"
          echo "Updated existing health-radar comment ${EXISTING}."
        else
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --method POST \
            -F "body=@${RUNNER_TEMP}/comment.md"
          echo "Posted new health-radar comment."
        fi
